# docs.yml — Build private-engine Docusaurus and deploy to GitHub Pages
#
# SETUP REQUIRED (one-time, HITL):
#   1. Create a fine-grained PAT on adlc-framework repo:
#      • Repository access: adlc-framework only
#      • Permission: Contents = Read-only (no write, no actions)
#      • Expiry: ≤ 90 days; set a calendar reminder to rotate
#   2. Add the PAT as a repo secret named ADLC_FRAMEWORK_PAT
#      (Settings → Secrets and variables → Actions → New repository secret)
#      OR for local `act` use: --secret-file .secrets  (see .secrets.example)
#   3. Enable Pages: Settings → Pages → Source = GitHub Actions
#
# LOCAL TESTING WITH act:
#   act push -W .github/workflows/docs.yml --secret-file .secrets
#   The BUILD job runs locally.
#   The DEPLOY job is GitHub-only (OIDC + Pages environment not emulated by act).

name: Docs — Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - b2b
    paths:
      - "docs/content/**"
      - "docs/static/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deploys; allow an in-progress build to complete.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build Docusaurus site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo (default token)
        uses: actions/checkout@v4

      # Sparse-checkout the private engine from adlc-framework.
      # ADLC_FRAMEWORK_PAT must be a fine-grained PAT scoped to adlc-framework
      # with Contents: Read-only.  Set this repo secret (fine-grained PAT,
      # Contents:Read-only on adlc-framework) OR for local `act` use
      # --secret-file .secrets
      - name: Checkout private Docusaurus engine (sparse)
        uses: actions/checkout@v4
        with:
          repository: 1xOps/adlc-framework
          token: ${{ secrets.ADLC_FRAMEWORK_PAT }}
          ref: command-center
          # cone-mode: false required — cone mode silently excludes dotfile dirs (.claude/) at repo root.
          # Two-line form: /** covers nested files; trailing slash covers files directly in the dir root.
          sparse-checkout: |
            .claude/plugins/commerce/templates/docusaurus/**
            .claude/plugins/commerce/templates/docusaurus/
          sparse-checkout-cone-mode: false
          path: _engine

      # ACT-only fallback (legacy). With `ref: command-center` the sparse-checkout above now
      # provides the engine for act too, so this is a transparent no-op. Kept only to avoid a
      # hard failure on older local setups; emits a notice either way (no silent green-washing).
      - name: Populate engine from local workspace copy (act only)
        if: ${{ env.ACT == 'true' }}
        run: |
          DST=_engine/.claude/plugins/commerce/templates/docusaurus
          SRC=_engine_src/.claude/plugins/commerce/templates/docusaurus
          if [ -d "$DST" ]; then
            echo "::notice::engine present from sparse-checkout (ref: command-center) — no fallback needed"
          elif [ -d "$SRC" ]; then
            mkdir -p _engine/.claude/plugins/commerce/templates
            cp -r "$SRC" "$DST"
            echo "::warning::engine missing from sparse-checkout; used local _engine_src (--bind). CI would FAIL here — check ref/branch."
          else
            echo "::error::engine absent from BOTH sparse-checkout and _engine_src — build will fail (this is the real CI state, not masked)."
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install engine dependencies
        working-directory: _engine/.claude/plugins/commerce/templates/docusaurus
        run: npm ci

      - name: Copy public content into engine content path
        run: |
          cp -r docs/content/. \
            _engine/.claude/plugins/commerce/templates/docusaurus/content/

      - name: Copy static assets into engine
        run: cp -r docs/static/. _engine/.claude/plugins/commerce/templates/docusaurus/static/

      # FAST-FAIL MDX pre-flight (CA ask_7, AC-D1). Compiles every copied
      # content/**/*.{md,mdx} with the engine's @mdx-js/mdx (the same MDX v3 compiler
      # Docusaurus 3.10 uses) and aborts the job with `file:line: message` on the FIRST
      # MDX error — BEFORE the slower full Docusaurus build. CONTENT_DIR points at the
      # copied content the build actually compiles. Additive only; does not touch the
      # proven sparse-checkout / PAT / copy / build / upload / deploy steps.
      - name: MDX pre-flight (fast-fail)
        # Run the PUBLIC repo's copy of the script (ships in this repo, so it does NOT
        # depend on the private engine REPO having mdx-preflight.mjs). working-directory
        # stays the engine dir so `@mdx-js/mdx` resolves from the engine's installed
        # node_modules (npm ci above). CONTENT_DIR points at the copied content.
        working-directory: _engine/.claude/plugins/commerce/templates/docusaurus
        run: node ${{ github.workspace }}/scripts/mdx-preflight.mjs
        env:
          CONTENT_DIR: ${{ github.workspace }}/_engine/.claude/plugins/commerce/templates/docusaurus/content
          # @mdx-js/mdx lives in the engine's node_modules (npm ci above), not the public
          # repo. Anchor the public script's require.resolve at the engine package.json.
          MDX_RESOLVE_BASE: ${{ github.workspace }}/_engine/.claude/plugins/commerce/templates/docusaurus/package.json

      - name: Build Docusaurus site
        # The engine npm run build uses --out-dir /site_out/site (Docker bind-mount path).
        # In CI there is no bind-mount, so we call docusaurus build directly with an
        # absolute workspace path as the out-dir.
        working-directory: _engine/.claude/plugins/commerce/templates/docusaurus
        run: npx docusaurus build --out-dir ${{ github.workspace }}/docs/site
        env:
          NODE_ENV: production

      - name: Upload Pages artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # OIDC deployment — no PAT needed for this job.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
