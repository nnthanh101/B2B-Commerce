# docker-compose.observability.yml — B2B-Commerce opt-in observability stack
#
# ADR-007 AMENDMENT 2026-06-05: hybrid-cloud SSOT, execute NOW
#
# Usage:
#   task up    (includes this file via -f overlay — observability cold-boots with commerce)
#   task obs:up (standalone start — app containers must already be running)
#   task obs:down (stop observability only, leaves main platform running)
#
# Registry exemption (ADR-007 §8): prom/*, grafana/*, prometheuscommunity/*, oliver006/*
#   are semver-pinned observability images with no nnthanh101/* equivalent.
#   Pinned tags prevent supply-chain drift. Review at each quarterly version reconciliation.
#
# Network: joins ec_network (external) — created by docker-compose.yml with `name: ec_network`.
#   All targets use Docker container names (ec_backend, ec_postgres, ec_redis) for cross-project DNS.
#   The `name: ec_network` in docker-compose.yml ensures both stacks share one named network.
#
# SRE contract: observability is a CRITICAL SRE task but MUST NOT block the commerce stack.
#   - ec and storefront have NO depends_on pointing here.
#   - prometheus and grafana have healthchecks (self-healing), not dependency gates.
#
# Secrets hygiene (ADR-007 §9): GF_SECURITY_ADMIN_PASSWORD set via env var only.
#   Set in shell or .env (gitignored). Default "admin" is blocked here — must be overridden.
#   Cloud promotion: swap to Secrets Manager / Key Vault.

services:

  # ─── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: ec_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ec_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      application: b2b-commerce
      service: observability
      environment: local
      managed-by: adlc

  # ─── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:12.0.1
    container_name: ec_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set (add to .env or shell before task up)}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/commerce.json
      # Anonymous viewer — local demo + screenshot capture only (ADR-007 §local-demo)
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - ec_network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      application: b2b-commerce
      service: observability
      environment: local
      managed-by: adlc

  # ─── Postgres exporter ────────────────────────────────────────────────────────
  # CROSS-PROJECT DNS: uses container name ec_postgres:5432 (resolved via named ec_network)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: ec_postgres_exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@ec_postgres:5432/ec-store?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - ec_network
    labels:
      application: b2b-commerce
      service: postgres
      environment: local
      managed-by: adlc

  # ─── Redis exporter ───────────────────────────────────────────────────────────
  # CROSS-PROJECT DNS: uses container name ec_redis:6379 (no scheme — Go net.Dial treats scheme as network type).
  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: ec_redis_exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=ec_redis:6379
    ports:
      - "9121:9121"
    networks:
      - ec_network
    labels:
      application: b2b-commerce
      service: redis
      environment: local
      managed-by: adlc

  # ─── Node exporter ────────────────────────────────────────────────────────────
  # Scrapes host metrics (CPU, memory, disk) via /proc and /sys bind mounts
  # macOS: pid_filesystem not available — node-exporter runs in degraded mode (expected)
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: ec_node_exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - ec_network
    labels:
      application: b2b-commerce
      service: node
      environment: local
      managed-by: adlc

volumes:
  prometheus_data:
    name: ec_prometheus_data
  grafana_data:
    name: ec_grafana_data

networks:
  ec_network:
    external: true
