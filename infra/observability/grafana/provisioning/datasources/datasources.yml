# Grafana datasource provisioning — B2B-Commerce observability stack
#
# CA condition adr-004-datasource-uid-deterministic:
#   uid MUST be the literal string "prometheus" (not an auto-generated UUID).
#   Every panel query in commerce.json references datasource uid "prometheus".
#   Changing this uid breaks all dashboards — treat as load-bearing.
#
# Access model:
#   url: http://prometheus:9090 — Docker DNS resolves inside ec_network.
#   No auth required (internal network isolation boundary = security boundary for local dev).

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: POST
