version: "3"

# OceanSoft B2B Commerce — Tests domain Taskfile (RQ2 automation harness)
# Delegated from root Taskfile (includes: test: ./tests/Taskfile.yml)
# Tiers: 1 static · 3a integration (HTTP, @medusajs/test-utils) · 3b e2e (Playwright) · report
#
# Full graph (needs Docker):   task test:all
# Step-by-step:
#   task test:static
#   task test:db:up && task test:integration && task test:db:down
#   task test:e2e        # SKIPs if backend :9000 unreachable
#   task test:report
#
# Integration env: DATABASE_URL -> :5433/ec-store-test, REDIS_URL -> :6380 (docker-compose.test.yml)
#   No-Docker: export DATABASE_URL=postgres://postgres@localhost:5432/ec_store_test REDIS_URL=redis://localhost:6379 ; then task test:db:up:local && task test:integration

vars:
  REPO: "{{.TASKFILE_DIR}}/.."
  REPORT_DIR: "{{.TASKFILE_DIR}}/../tmp/Digital-Commerce/test-results"
  COMPOSE_FILE: "{{.TASKFILE_DIR}}/../docker-compose.test.yml"
  PROJECT: ec_test
  DB_URL: "postgres://postgres:postgres@localhost:5433/ec-store-test"
  REDIS: "redis://localhost:6380"
  BACKEND_URL: "http://localhost:9000"

tasks:
  default:
    desc: "List available test targets"
    cmds:
      - task --list

  static:
    desc: "Tier 1 — static checks (tsc + lint). Delegates to root lint task."
    dir: "{{.REPO}}"
    cmds:
      - task lint

  db:up:
    desc: "Bring up ephemeral test DB (postgres :5433 + redis :6380, tmpfs => idempotent)"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} -p {{.PROJECT}} up -d --wait
    status:
      - docker compose -f {{.COMPOSE_FILE}} -p {{.PROJECT}} ps --status running | grep -q postgres-test

  db:down:
    desc: "Tear down ephemeral test DB + volumes (idempotent)"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} -p {{.PROJECT}} down -v --remove-orphans || true

  db:up:local:
    desc: "Provision local test DB (PostgreSQL) without Docker — no containers required"
    cmds:
      - |
        if ! which psql >/dev/null 2>&1; then
          echo "PostgreSQL not found. Run: brew install postgresql@15"
          exit 1
        fi
      - createdb ec_store_test 2>/dev/null || true
      - |
        export DATABASE_URL=postgres://postgres@localhost:5432/ec_store_test
        export REDIS_URL=redis://localhost:6379
        cd {{.REPO}}/apps/backend && npm run db:migrate
      - |
        export DATABASE_URL=postgres://postgres@localhost:5432/ec_store_test
        export REDIS_URL=redis://localhost:6379
        cd {{.REPO}}/apps/backend && npm run db:seed

  integration:
    desc: "Tier 3a — backend HTTP integration tests (requires db:up). Writes jest-integration.json"
    dir: "{{.REPO}}"
    env:
      DATABASE_URL: "{{.DB_URL}}"
      REDIS_URL: "{{.REDIS}}"
    cmds:
      - mkdir -p {{.REPORT_DIR}}
      - pnpm --filter @oceansoft/backend test:integration:http -- --json --outputFile={{.REPORT_DIR}}/jest-integration.json

  e2e:
    desc: "Tier 3b — Playwright E2E. SKIPs (exit 0) if backend :9000 unreachable."
    dir: "{{.REPO}}"
    cmds:
      - |
        if ! curl -sf {{.BACKEND_URL}}/health >/dev/null 2>&1; then
          echo "[SKIP] e2e: backend not reachable at {{.BACKEND_URL}} — Playwright suite skipped"
          exit 0
        fi
        mkdir -p {{.REPORT_DIR}}
        PLAYWRIGHT_JSON_OUTPUT_NAME={{.REPORT_DIR}}/playwright-json-results.json \
          npx playwright test tests/e2e/ --reporter=json,html || true

  live:
    desc: "Tier 3a-live — HTTP integration smoke vs the RUNNING backend (no inApp boot). Needs `task up`."
    dir: "{{.REPO}}"
    vars:
      ADMIN_EMAIL: '{{.ADMIN_EMAIL | default "admin@test.local"}}'
      ADMIN_PW: '{{.ADMIN_PW | default "Test1234!"}}'
    cmds:
      - |
        if ! curl -sf {{.BACKEND_URL}}/health >/dev/null 2>&1; then
          echo "[SKIP] live: backend not reachable at {{.BACKEND_URL}} — run 'task up' first"; exit 0
        fi
        # ensure an admin exists (idempotent; ignore 'already exists')
        docker compose exec -T ec sh -c "cd /server/apps/backend && npx medusa user -e {{.ADMIN_EMAIL}} -p {{.ADMIN_PW}}" 2>/dev/null || true
        # run the fetch-based live smoke in-container (jest + global fetch; backend at localhost:9000)
        docker compose exec -T ec sh -c "cd /server/apps/backend && ADMIN_EMAIL={{.ADMIN_EMAIL}} ADMIN_PW={{.ADMIN_PW}} npx jest --runInBand --forceExit integration-tests/live/live-api-smoke.spec.ts"

  visual:
    desc: "Tier 4 visual — browser (Playwright screenshots) + terminal (native screencapture, no MCP/extension)"
    dir: "{{.REPO}}"
    cmds:
      - mkdir -p {{.REPORT_DIR}}/screenshots
      - |
        # Browser surface — headless Playwright (works without any extension)
        if curl -sf {{.BACKEND_URL}}/health >/dev/null 2>&1; then
          TEST_ADMIN_EMAIL=admin@test.local TEST_ADMIN_PASSWORD=Test1234! \
            npx playwright test tests/e2e/screenshots.spec.ts --project=chromium || true
        else
          echo "[SKIP] visual-browser: backend not reachable — run 'task up'"
        fi
      - |
        # Terminal surface — native macOS screencapture of the iTerm2 window (proven method; no MCP, no approval prompt once Screen Recording is granted)
        if command -v screencapture >/dev/null 2>&1; then
          WID=$(bash .claude/hooks/scripts/capture-terminal-gif.sh --get-window-id iTerm 2>/dev/null || true)
          if [ -n "$WID" ]; then
            screencapture -l "$WID" -x -o "{{.REPORT_DIR}}/screenshots/VV-terminal-iterm2.png" && \
              echo "terminal capture: $(stat -f%z {{.REPORT_DIR}}/screenshots/VV-terminal-iterm2.png) bytes"
          else
            screencapture -x -o "{{.REPORT_DIR}}/screenshots/VV-terminal-fullscreen.png" && echo "fullscreen fallback captured"
          fi
        else
          echo "[SKIP] visual-terminal: screencapture not available (non-macOS)"
        fi
      - ls -la {{.REPORT_DIR}}/screenshots/VV-*.png 2>/dev/null || true

  report:
    desc: "Aggregate jest + Playwright + static JSON/logs into REPORT.md + REPORT.html"
    cmds:
      - mkdir -p {{.REPORT_DIR}}
      - node {{.TASKFILE_DIR}}/report/aggregate-report.mjs {{.REPORT_DIR}}

  all:
    desc: "Full graph: static -> db:up -> integration -> e2e -> live -> visual -> report -> db:down"
    cmds:
      - task: static
      - task: db:up
      - task: integration
      - task: e2e
      - task: live
      - task: visual
      - task: report
      - task: db:down
